PACKAGE_NAME="toshiba_acpi_dynabook"
PACKAGE_VERSION="0.25"
MAKE[0]="make -C \${kernel_source_dir} M=\${dkms_tree}/\${PACKAGE_NAME}/\${PACKAGE_VERSION}/build modules \$(if command -v clang >/dev/null 2>&1 && (grep -q CONFIG_CC_IS_CLANG=y \${kernel_source_dir}/.config 2>/dev/null || grep -q CONFIG_CC_IS_CLANG=y \${kernel_source_dir}/include/config/auto.conf 2>/dev/null || grep -qi clang /proc/version 2>/dev/null); then echo LLVM=1; fi)"
CLEAN="make -C \${kernel_source_dir} M=\${dkms_tree}/\${PACKAGE_NAME}/\${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="toshiba_acpi"
DEST_MODULE_LOCATION[0]="/updates"
DEST_MODULE_NAME[0]="toshiba_acpi"
AUTOINSTALL="yes"
